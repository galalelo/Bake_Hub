name: Release bundle

# Builds a signed Android App Bundle (.aab) for upload to Google Play.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   BAKEHUB_KEYSTORE_BASE64  - the upload keystore, base64-encoded (base64 -w0 upload-key.jks)
#   BAKEHUB_STORE_PASSWORD, BAKEHUB_KEY_ALIAS, BAKEHUB_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.BAKEHUB_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "BAKEHUB_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-key.jks"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build signed release bundle
        env:
          BAKEHUB_STORE_FILE: ${{ runner.temp }}/upload-key.jks
          BAKEHUB_STORE_PASSWORD: ${{ secrets.BAKEHUB_STORE_PASSWORD }}
          BAKEHUB_KEY_ALIAS: ${{ secrets.BAKEHUB_KEY_ALIAS }}
          BAKEHUB_KEY_PASSWORD: ${{ secrets.BAKEHUB_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bakehub-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
